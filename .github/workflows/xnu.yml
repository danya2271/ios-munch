name: xnu

on:
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: MUNCH
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'MUNCH' }}

permissions:
  contents: read

jobs:
  build:
    # Xcode 15's iig matches the xnu-8796 IORPC ABI used by this port.
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dxb/build.sh")
          text = path.read_text()
          needle = '                warning "Skipping patch ${PATCH} (already upstream, previously applied, or malformed): ${APPLY_CHECK}"'
          replacement = '''                case "${PATCH##*/}" in
                    [0-9][0-9][0-9][0-9]-*)
                        if [ "$MACHINE_CONFIG" = "MUNCH" ]; then
                            error "Refusing to skip MUNCH patch ${PATCH}: ${APPLY_CHECK}"
                            exit 1
                        fi
                        ;;
                esac
                warning "Skipping patch ${PATCH} (already upstream, previously applied, or malformed): ${APPLY_CHECK}"'''
          if text.count(needle) != 1:
              raise SystemExit("pinned DXB patch-skip handler changed; refusing a non-fail-closed build")
          path.write_text(text.replace(needle, replacement))
          PY
          grep -q 'Refusing to skip MUNCH patch' dxb/build.sh
          awk '
            { print }
            /^    patches$/ {
              print "    if [ \"$MACHINE_CONFIG\" = \"MUNCH\" ]; then"
              print "      grep -Eq \"^SUPPORTED_ARM64_MACHINE_CONFIGS = .* MUNCH$\" \"$WORK_DIR/xnu/makedefs/MakeInc.def\" || { error \"MUNCH machine config patch was not applied\"; exit 1; }"
              print "      test -f \"$WORK_DIR/xnu/pexpert/pexpert/arm64/MUNCH.h\" || { error \"MUNCH board header is missing\"; exit 1; }"
              print "    fi"
            }
          ' dxb/build.sh > dxb/build.sh.tmp
          grep -q 'MUNCH machine config patch was not applied' dxb/build.sh.tmp
          mv dxb/build.sh.tmp dxb/build.sh
          bash -n dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          grep -n 'MUNCH machine config patch was not applied' dxb/build.sh
          ls dxb/patches

      - name: Prepare Xcode
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print
          XC=$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' -print | sort -V | head -1)
          test -n "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar_args=(
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped'
            --exclude='kernel.development.*' --exclude='.git'
          )
          for path in build/xnu.obj fakeroot/usr/local/include xnu; do
            if [ -e "$GITHUB_WORKSPACE/dxb/$path" ]; then
              tar_args+=(-C "$GITHUB_WORKSPACE/dxb" "$path")
            fi
          done
          tar_args+=(-C "$GITHUB_WORKSPACE" sdk-kernel-platform)
          tar czf buildtree.tgz "${tar_args[@]}"
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            [ -f "$lib" ] || continue
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect kernel artifacts
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
